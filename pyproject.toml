[project]
name = "ricardo-pnadc"
version = "1.0.0"
description = "Exposição ocupacional à IA e transições de trabalho na PNAD Contínua"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-bigquery-storage>=2.25",
    "db-dtypes",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pyyaml>=6",
    "requests>=2.32",
    "openpyxl>=3.1",
    "xlrd>=2",
    "numpy>=2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pyfixest>=0.60",
    "psutil>=5.9",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
